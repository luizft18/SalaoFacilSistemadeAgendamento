<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de contato do site">
    <title>Salão Fácil</title>
    <link rel="stylesheet" href="./assets/css/style-contato.css">
    <script src="./assets/js/script-contato.js" defer></script>
</head>
<body>
    <header>
        <div id="logo-titulo">
            <img src="./assets/img/SF.png" alt="ícone do sistema" class="icone">
            <h1>Salão Fácil</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#agendamento">Agendamento</a></li>
                <li><a href="contato.html">Fale concosco</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="formulario_contato">
            <form action="obrigato.html" method="post">
                <fieldset>
                    <p>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </p>    

                    <p>
                        <label for="email">E-mail:</label>
                        <input type="text" id="email" name="email" required aria-describedby="emailHelp">
                        <span id="emailHelp">Digite um e-mail válido.</span>
                    </p>

                    <p>
                        <!--#TEL - VALIDAÇÃO DE TELEFONE-->
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" pattern="[0-9]{10,11}" placeholder="(99) 99999-9999" required>
                    </p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p> 
            <address> <abbr title="Residencial Parque Verde">Residencial Parque Verde</abbr>  - Q 100, Brasília - DF. CEP: 700000</address>
        </p>
    </footer>
</body>
